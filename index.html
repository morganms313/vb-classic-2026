<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Frosh-Soph Classic 2026</title>
  <meta name="description" content="The 2026 Valencia Frosh-Soph Classic is over. Thanks for following along.">
  <meta name="theme-color" content="#3b1f66">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f4f2f8; --card: #fff; --ink: #1d1729; --muted: #6d6780; --purple: #3b1f66; --purple-2: #5a3496; --gold: #e3b23c; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #14101c; --card: #1f1a2b; --ink: #ece8f4; --muted: #a29bb4; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #14101c; --card: #1f1a2b; --ink: #ece8f4; --muted: #a29bb4; color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main { width: 100%; max-width: 420px; background: var(--card); border-radius: 18px; padding: 28px 22px; text-align: center; box-shadow: 0 4px 24px rgb(0 0 0 / .08); }
    img { width: 96px; height: 96px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--gold); }
    .kicker { margin-top: 16px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 6px 0 10px; font-size: 24px; line-height: 1.2; }
    p { margin: 0 0 18px; color: var(--muted); }
    a.btn { display: inline-block; min-height: 44px; padding: 11px 18px; border-radius: 10px; background: var(--purple-2); color: #fff; font-weight: 700; text-decoration: none; }
    small { display: block; margin-top: 18px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Lady Vikings logo" width="96" height="96">
    <div class="kicker">Saturday, September 26, 2026</div>
    <h1>The Frosh-Soph Classic is a wrap</h1>
    <p>Thanks for following along, and congratulations to every team that played. See you next season!</p>
    <a class="btn" href="https://www.ladyvikingsvolleyball.com/">Lady Vikings Volleyball</a>
    <small>This was an unofficial parent site for the tournament.</small>
  </main>
  <script>
    // Remove the old tournament app's offline copy from phones that visited it.
    try {
      navigator.serviceWorker?.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
      window.caches?.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
    } catch { /* not supported */ }
  </script>
</body>
</html>
